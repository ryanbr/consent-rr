name: build

# dist/ is what uBlock Origin fetches over a raw URL, so a stale copy there
# ships stale code to everyone. This rebuilds from src/ and fails if the result
# differs from what was committed.

on:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'test/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every source file on its own: a syntax error named for the file it is
      # in rather than the resource it was concatenated into, a template
      # literal before the bundler silently strips the line it is on, and a
      # lib no entry includes. It ran nowhere for a long time, and rotted.
      - run: npm run lint
      # Builds, then runs the suite against the built files.
      - run: npm test
      - name: dist and COMPARISON.md match src
        run: |
          if ! git diff --exit-code --stat -- dist COMPARISON.md; then
            echo "::error::committed output is stale - run 'npm test' and commit the result"
            exit 1
          fi
