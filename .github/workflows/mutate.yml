name: mutate

# Mutation testing for the three hand-maintained resources under extra/. Each
# mutation breaks the resource one substitution at a time and asks whether its
# test file notices; a survivor means a test is not testing what it names.
#
# Only on a change that can move the answer - the resources, their tests, the
# mutation lists or the tool - plus a weekly run, because the tests depend on
# jsdom and node behaviour that npm ci can bring in under us. Not on every
# push: a sweep is minutes, and src/ cannot change it.

on:
  pull_request:
    paths:
      # The resources, not their notes: extra/*.md cannot change what a
      # mutation does, and a notes-only commit used to fire the whole
      # matrix - five of them in a row, each cancelling the last.
      - 'extra/*.js'
      - 'test/adobe-launch.test.mjs'
      - 'test/vwo.test.mjs'
      - 'test/application-insights.test.mjs'
      - 'test/optimizely.test.mjs'
      - 'test/perimeterx.test.mjs'
      - 'test/tealium.test.mjs'
      - 'tools/mutate.mjs'
      - 'tools/mutations/**'
      - '.github/workflows/mutate.yml'
  push:
    branches: [ main ]
    paths:
      # The resources, not their notes: extra/*.md cannot change what a
      # mutation does, and a notes-only commit used to fire the whole
      # matrix - five of them in a row, each cancelling the last.
      - 'extra/*.js'
      - 'test/adobe-launch.test.mjs'
      - 'test/vwo.test.mjs'
      - 'test/application-insights.test.mjs'
      - 'test/optimizely.test.mjs'
      - 'test/perimeterx.test.mjs'
      - 'test/tealium.test.mjs'
      - 'tools/mutate.mjs'
      - 'tools/mutations/**'
      - '.github/workflows/mutate.yml'
  schedule:
    # Mondays, 05:17 UTC. Off the hour, because every job scheduled on it
    # queues together.
    - cron: '17 5 * * 1'
  workflow_dispatch:

# A sweep is minutes, so a second push should not leave two of them running
# over the same lists - the older answer is about code nobody has any more. An
# in-flight sweep on this ref is cancelled when a newer one starts; this had to
# be done by hand once already.
concurrency:
  group: mutate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One list is not the others: a survivor in tealium should not hide
      # whether optimizely is still clean.
      fail-fast: false
      matrix:
        resource: [adobe-launch, application-insights, optimizely, perimeterx, tealium, vwo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The suite has to pass before breaking it means anything: a sweep over
      # a red suite kills every mutation and says nothing.
      - name: the suite passes unmutated
        run: node --test --test-timeout=30000 test/${{ matrix.resource }}.test.mjs
      # A hosted runner is slower than a laptop, and cutting a run short that
      # was going to fail reads as a survivor, so both are well past what the
      # sweep needs locally. The run timeout should never be reached now that
      # the tool passes --test-force-exit: it is the net under a mutation that
      # hangs a test rather than the process.
      - name: ${{ matrix.resource }}
        env:
          MUTATE_TEST_TIMEOUT: 30000
          MUTATE_RUN_TIMEOUT: 120000
        run: npm run mutate -- ${{ matrix.resource }}
